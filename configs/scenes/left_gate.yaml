# Left-gate scene: uses SousVide's existing alignment and gsplat assets for v0
# smoke testing. When a new gsplat asset arrives, copy this file and update
# the paths + transforms; you can also add or rename frames freely — the
# orchestrator/sim/policy never hardcode frame names.

scene_key: left_gate
gsplat_path: data/colmap/left_gate/sagesplat/2025-10-06_215922
gsplat_config_yml: data/colmap/left_gate/sagesplat/2025-10-06_215922/config.yml

# Mission specification — all in MOCAP (Z-up world ground truth).
start_position_mocap: [0.104, -0.022, 1.364]
goal_position_mocap:  [1.421, -0.332, 1.000]
gate_position_mocap:  [0.805,  0.797, 1.500]

# Frames active in this scene. The first four are the canonical defaults;
# the camera frames are declared here because their body-relative SE3s are
# scene/drone-specific.
frames:
  - { name: mocap, notes: "Motion-capture Z-up world (ground truth)" }
  - { name: ned,   notes: "FiGS dynamics (North-East-Down)" }
  - { name: colmap, notes: "Raw SfM frame" }
  - { name: ns,    notes: "Nerfstudio-internal (dataparser-transformed, scaled)" }
  - { name: cam_body, notes: "Drone body frame (IMU origin)" }
  - { name: cam_forward, notes: "Forward-facing camera optical frame (OpenCV: x right, y down, z forward)" }
  - { name: cam_downward, notes: "Downward-facing camera optical frame (OpenCV)" }

# Transforms.  Each ``type`` is a registered loader in
# ``falsify.geometry.loaders``.  Inverse edges are derived automatically by
# the FrameGraph.
transforms:
  # FiGS NED ↔ MOCAP Z-up
  - { src: ned, dst: mocap, type: permutation, preset: "perm5" }

  # MOCAP ↔ COLMAP via the SousVide-style Sim3 file.
  - { src: colmap, dst: mocap, type: sim3_file, path: ../../data/alignment/left_gate/colmap_to_mocap_sim3.json }

  # COLMAP → NS via Nerfstudio's dataparser_transforms.json.
  - { src: colmap, dst: ns, type: dataparser, path: ../../data/colmap/left_gate/sagesplat/2025-10-06_215922/dataparser_transforms.json }

  # Body → forward camera. Numbers below come from SousVide carl.json's
  # ``camera_to_body_transform`` interpreted as ``T_body_from_cam``; we
  # register the inverse ``T_cam_from_body`` here.
  - { src: cam_body, dst: cam_forward, type: se3_inline,
      R: [[0, 1, 0], [0, 0, -1], [-1, 0, 0]],
      t: [0.03, -0.01, 0.10],
      invert: false }

  # Body → downward camera. PLACEHOLDER: nominal pointing-down mount with a
  # 5cm offset along body +z. Update with real intrinsics once measured.
  - { src: cam_body, dst: cam_downward, type: se3_inline,
      R: [[1, 0, 0], [0, 1, 0], [0, 0, 1]],
      t: [0.0, 0.0, -0.05] }
