# Calibrated AABBs for selecting gate Gaussians in the gate-scenes splat.
#
# Why this file exists
# --------------------
# data/gate_scenes_export/objects_final/objects_summary.json carries tight
# AABBs computed from the *extracted PLYs* — those bounds are exactly the
# point-cloud extents, but the trained gsplat has fuzzier "edge" Gaussians
# that extend beyond. The values below were tuned visually in ns-viewer
# (preview_scene_nsviewer + the inspector overlay) so that a rigid-
# transform edit grabs the full gate, including stragglers, while
# explicitly excluding the table region for any low-z overlap.
#
# These are the values the falsify scene_edits machinery should use when
# moving gate Gaussians. Each `include` AABB is in MOCAP; each `exclude`
# is also in MOCAP and represents a sibling object whose Gaussians must
# stay put.
#
# Provenance
# ----------
# `tight_aabb` is copied from objects_summary.json for reference.
# `include` is `tight_aabb` widened by ~0.15 m in xy and ~0.08 m in z.
# `exclude` is the corresponding table's AABB from objects_summary.json,
# with z slightly extended to be safe.

left_gate:
  tight_aabb:
    min: [0.5129038, 0.2721301, 0.0751088]
    max: [1.2099999, 1.1152959, 1.9749730]
  include:
    min: [0.36, 0.12, 0.05]
    max: [1.36, 1.27, 2.05]
  exclude_aabbs:
    - name: left_table
      min: [1.20, -0.85, 0.02]
      max: [1.85, 0.40, 0.62]
  # Plane posts (gate columns in xy), tangent of motion is along (P2-P1)
  # and the outward normal is its 90° CW rotation:
  plane_posts: [[1.18, 0.45], [0.65, 1.05]]
  source_anchor: [0.861, 0.694, 0.075]    # AABB-floor center
  source_normal: [0.749, 0.663, 0.0]      # outward normal in flight direction

right_gate:
  tight_aabb:
    min: [0.0853787, -1.3971170, 0.0737114]
    max: [1.0027250, -0.8970037, 1.9484649]
  include:
    # Widened similarly to left. The right_gate AABB max-x (1.00) is well
    # below right_table min-x (1.27), so the table is not adjacent; no
    # exclusion is required for the standard gaussian-grabbing pose.
    min: [-0.065, -1.547, 0.0]
    max: [1.153, -0.747, 2.03]
  exclude_aabbs: []                        # not adjacent to the right table
  plane_posts: [[0.47, -1.24], [0.11, -1.39]]
  source_anchor: [0.544, -1.147, 0.074]
  source_normal: [0.385, -0.923, 0.0]
