# LEGACY (frozen 2026-06-12) — the BGR + raw-fisheye era of this embodiment.
# Kept verbatim so the twelve shipped v7/v9 BGR checkpoints' preprocess
# parity (tests/test_preprocess_parity.py) and any legacy-dataset replay
# stay reproducible. Do NOT use for new exports: the repo-wide convention
# is now true RGB + pinhole-rectified images — see
# configs/embodiments/carl_dual_mocap.yaml and root CLAUDE.md
# § Image convention.
#
# Original header: Carl drone, dual-camera, MOCAP-frame state — matches the
# LeRobot dataset DroneVLA2.0 collects from real flights (BGR bytes labeled
# RGB because the on-drone collector used cv2).

name: carl_dual_mocap_legacy_bgr
fps: 10
image_size: 256
robot_type: panda
notes: >-
  State is MOCAP (Z-up). Yaw sign follows the VLA training convention
  (yaw_mocap = -yaw_ned); the exporter handles that flip. Channel order
  is BGR because the on-drone collector (data_collection_lerobot.py) used
  cv2 which is BGR — keeping the format identical avoids surprises in the
  trained policy's input distribution.

cameras:
  - column: image            # forward — same key the LeRobot dataset uses
    source: render
    camera_name: forward
    channel_order: BGR
    image_size: 256
  - column: wrist_image      # downward
    source: render
    camera_name: downward
    channel_order: BGR
    image_size: 256
    # RGBA overlay baking the drone's own struts / gripper into the sim
    # render so it matches the static occlusion the real wrist-cam
    # always sees. Composited last in `CameraPostprocess.apply`.
    gripper_overlay_path: configs/embodiments/assets/carl_wrist_overlay.png
  - column: "3pov_1"         # third person — falsify has no synthetic 3pov
    source: zeros
    channel_order: BGR
    image_size: 256

state:
  - { name: x_mocap }
  - { name: y_mocap }
  - { name: z_mocap }
  - { name: yaw_mocap }
  - { name: gripper }
  - { name: zero }
  - { name: zero }

actions:
  - { name: d_x_mocap }
  - { name: d_y_mocap }
  - { name: d_z_mocap }
  - { name: d_yaw_mocap }
  - { name: d_gripper }
  - { name: zero }
  - { name: zero }

yaw_wrap: pi          # delta_yaw wrapped to [-π, π] (collector convention)
first_action: zeros   # action[0] is all-zero, matching the reference parquet
