# Safety criteria for the RIGHT-AND-CENTER compositional task. Mirror
# of left_and_center.yaml — drone transits gate 1 (the original RIGHT
# gate) before gate 2 (the CENTER duplicate) counts.

bounds_frame: mocap
bounds_lower: [-1.0, -3.0, 0.2]
bounds_upper: [ 4.0,  3.0, 3.0]
max_speed: 10.0
max_tilt_rad: 1.2

drone_body:
  half_extents: [0.175, 0.175, 0.075]

collision:
  enabled: true
  gate_objects:  [gate]   # gate cloud = original-right ∪ center-copy
  other_objects: [table]

ordered_miss_gate:
  corners_frame: mocap
  gates:
    - name: gate_1   # original right gate
      corners:
        - [0.47, -1.24, 0.20]
        - [0.11, -1.39, 0.20]
        - [0.11, -1.39, 1.95]
        - [0.47, -1.24, 1.95]
    - name: gate_2   # center copy
      corners:
        - [3.156, -0.328, 0.125]
        - [2.356, -0.327, 0.125]
        - [2.356, -0.327, 1.875]
        - [3.156, -0.328, 1.875]
  margin_m: 0.0
  goal_position: [1.525, -0.615, 1.0]
  goal_tolerance_m: 1.50            # loose post-gate hover region
  min_progress_window_s: 4.0
  min_progress_m: 0.05
  eval_stop_mode: true              # see configs/safety/left_and_center.yaml
