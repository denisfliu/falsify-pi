# Safety criteria for a right_gate VLA rollout. Mirror of
# configs/safety/left_gate.yaml — aperture corners are the right-gate's
# plane-cut posts ((0.47, -1.24) and (0.11, -1.39) in MOCAP) with the
# same physical aperture height [0.20, 1.95] m.

bounds_frame: mocap
bounds_lower: [-1.0, -3.0, 0.2]
bounds_upper: [ 4.0,  3.0, 3.0]
max_speed: 10.0
max_tilt_rad: 1.2

drone_body:
  half_extents: [0.175, 0.175, 0.075]

collision:
  enabled: true
  gate_objects:  [gate]
  other_objects: [table]

# Right-gate aperture in MOCAP. Trace order matches left_gate's
# convention: post-A bottom → post-B bottom → post-B top → post-A top.
miss_gate:
  corners_frame: mocap
  corners:
    - [0.47, -1.24, 0.20]
    - [0.11, -1.39, 0.20]
    - [0.11, -1.39, 1.95]
    - [0.47, -1.24, 1.95]
  margin_m: 0.0
  # Shared "stuffed animal" hover across left/right/center single-gate scenes;
  # matches courses/through_right_gate.yaml hover waypoint so the eval success
  # criterion lines up with where the VLA was trained to fly.
  goal_position: [1.525, -0.615, 1.0]
  # See configs/safety/center_gate.yaml + left_gate.yaml for the rationale.
  goal_tolerance_half_extents: [0.3, 0.3, 0.5]
  goal_tolerance_m: 1.50            # legacy sphere — unused when box is set
  min_progress_window_s: 4.0
  min_progress_m: 0.05
  eval_stop_mode: true              # see configs/safety/left_gate.yaml
