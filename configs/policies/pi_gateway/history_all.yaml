# Pi inference-client gateway — pi07 HISTORY mode, "all gate scenes" finetune.
# History counterpart of `nonhistory_all_93sufwik_7500.yaml` (same union of
# gate-scenes-* subsets, but with HISTORY_LC + gemma3_vla_history base).
# See `history_h6jtbq0w_20k.yaml` for the contract notes (RTC requirements,
# self-hosted vs Pi-hosted, etc.).

type: pi_gateway

gateway_url: "ws://moraband.stanford.edu:8765/v1/models/v7-history-all"
api_key:     "${env:PI_API_KEY}"

# Multi-policy bridge handshake. `bridge_policy_id` must match the registry
# entry on the bridge YAML.
bridge_admin_url: "http://moraband.stanford.edu:8765"
bridge_policy_id: "v7-history-all"

execute_chunk_size: 25
# No `prompt:` here — the runner injects card.prompt; see other YAMLs.

hz: 30
state_dim: 7
action_dim: 7
action_pos_slice: [0, 3]
action_yaw_index: 3

camera_map:
  forward:  "observation/rgb/image"
  downward: "observation/wrist_image/rgb/image"

# Match the training-data preprocess exactly. See
# `nonhistory_ccvhs1do_20k.yaml` for the rationale.
image_size: 256
channel_order: "BGR"

gripper_overlay_paths:
  downward: configs/embodiments/assets/carl_wrist_overlay.png
server_frame: "mocap"

embodiment_path: configs/embodiments/carl_dual_mocap.yaml
# History variants use RTC by default (the loaded checkpoint must export a
# sample function whose kwargs_spec contains both `initial_noise` and
# `prefix_info`/`prefix` — for v7 history this is `sample_actions_with_prefix`).
# Disable per-run with `--no-rtc` for deterministic eval campaigns.
use_rtc: true

traceability:
  variant: "pi07_history_all"
  wandb_run: "TODO"
  step: "TODO"
  checkpoint_uri: "TODO"
  processor_name: "dronevla_v7_gate_scenes_all"
  base_model: "gemma3_vla_history + HISTORY_LC"
  notes: "History-mode counterpart of nonhistory_all_93sufwik_7500 over the union of gate-scenes-* (~299 episodes)."
