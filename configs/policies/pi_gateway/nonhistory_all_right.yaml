# Pi inference-client gateway — pi07 NONHISTORY mode, "all-right" finetune.
# Sibling of `nonhistory_all_93sufwik_7500.yaml` but restricted to the
# right-gate slice of the union (gate-scenes-*-right only).

type: pi_gateway

gateway_url: "ws://moraband.stanford.edu:8765/v1/models/v7-nonhistory-all-right"
api_key:     "${env:PI_API_KEY}"

bridge_admin_url: "http://moraband.stanford.edu:8765"
bridge_policy_id: "v7-nonhistory-all-right"

execute_chunk_size: 25
# No `prompt:` here — the runner injects card.prompt; see other YAMLs.

hz: 30
state_dim: 7
action_dim: 7
action_pos_slice: [0, 3]
action_yaw_index: 3

camera_map:
  forward:  "observation/rgb/image"
  downward: "observation/wrist_image/rgb/image"

# Match the training-data preprocess exactly. See
# `nonhistory_ccvhs1do_20k.yaml` for the rationale.
image_size: 256
channel_order: "BGR"

gripper_overlay_paths:
  downward: configs/embodiments/assets/carl_wrist_overlay.png
server_frame: "mocap"

embodiment_path: configs/embodiments/carl_dual_mocap.yaml
traceability:
  variant: "pi07_nonhistory_all_right"
  wandb_run: "TODO"
  step: "TODO"
  checkpoint_uri: "TODO"
  processor_name: "dronevla_v7_gate_scenes_all_right"
  base_model: "gemma3_vla_with_states + NONHISTORY_LC"
  notes: "Right-only slice of the v7 nonhistory 'all' finetune."
