# Pi inference-client gateway — pi07 NONHISTORY mode, "all gate scenes" finetune
# (93sufwik / step 7500). may19 GPU finetune over every gate-scenes subset.
# Sibling of ccvhs1do (the may17 nonhistory checkpoint) but later step and
# different RNG seed.

type: pi_gateway

gateway_url: "ws://moraband.stanford.edu:8765/v1/models/v7-nonhistory-all"
api_key:     "${env:PI_API_KEY}"

# Multi-policy bridge handshake — see history_h6jtbq0w_20k.yaml for the
# contract. `bridge_policy_id` must match the registry entry on the
# bridge YAML.
bridge_admin_url: "http://moraband.stanford.edu:8765"
bridge_policy_id: "v7-nonhistory-all"

execute_chunk_size: 25
prompt: "fly through the gate"

hz: 30
state_dim: 7
action_dim: 7
action_pos_slice: [0, 3]
action_yaw_index: 3

camera_map:
  forward:  "observation/rgb/image"
  downward: "observation/wrist_image/rgb/image"

# Match the training-data preprocess exactly. See
# `nonhistory_ccvhs1do_20k.yaml` for the rationale.
image_size: 256
channel_order: "BGR"

server_frame: "mocap"

traceability:
  variant: "pi07_nonhistory_all"
  wandb_run: "93sufwik"
  step: 7500
  offline_mse: 1.5e-05
  checkpoint_uri: "gs://dronevla-raw-data/model_checkpoints/2026_may19/mar16_nonhistory_ft_dronevla_v7_gate_scenes_all_gpu_may19_140am/93sufwik/7500/model_bfloat16/"
  processor_name: "dronevla_v7_gate_scenes"
  base_model: "gemma3_vla_with_states + NONHISTORY_LC"
  notes: "may19 GPU finetune on the union of gate-scenes-* (~299 episodes / 241 frames each)."
