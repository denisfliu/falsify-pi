# Pi inference-client gateway — pi07 NONHISTORY mode, "real + synth" finetune
# (31ohxgxv / step 5000). may19 GPU finetune mixing real-center + synthetic
# gate-scenes data — strongest "best of both worlds" candidate among the
# may19 nonhistory family.

type: pi_gateway

gateway_url: "ws://moraband.stanford.edu:8765/v1/models/v7-nonhistory-real-synth"
api_key:     "${env:PI_API_KEY}"

# Multi-policy bridge handshake — see history_h6jtbq0w_20k.yaml for the
# contract. `bridge_policy_id` must match the registry entry on the
# bridge YAML.
bridge_admin_url: "http://moraband.stanford.edu:8765"
bridge_policy_id: "v7-nonhistory-real-synth"

execute_chunk_size: 25
prompt: "fly through the gate"

hz: 30
state_dim: 7
action_dim: 7
action_pos_slice: [0, 3]
action_yaw_index: 3

camera_map:
  forward:  "observation/rgb/image"
  downward: "observation/wrist_image/rgb/image"

# Match the training-data preprocess exactly. See
# `nonhistory_ccvhs1do_20k.yaml` for the rationale.
image_size: 256
channel_order: "BGR"

server_frame: "mocap"

traceability:
  variant: "pi07_nonhistory_real_synth"
  wandb_run: "31ohxgxv"
  step: 5000
  offline_mse: 8.0e-06
  checkpoint_uri: "gs://dronevla-raw-data/model_checkpoints/2026_may19/mar16_nonhistory_ft_dronevla_v7_gate_scenes_real_synth_gpu_may19_140am/31ohxgxv/5000/model_bfloat16/"
  processor_name: "dronevla_v7_gate_scenes"
  base_model: "gemma3_vla_with_states + NONHISTORY_LC"
  notes: "may19 GPU finetune mixing real-center + synthetic gate-scenes datasets."
