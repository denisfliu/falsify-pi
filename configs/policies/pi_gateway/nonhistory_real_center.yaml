# Pi inference-client gateway — pi07 NONHISTORY mode, "real-center" finetune
# (5b9p2kw1 / step 5000). Trained on the gate-scenes-real-center subset only.

type: pi_gateway

gateway_url: "ws://moraband.stanford.edu:8765/v1/models/v7-nonhistory-real-center"
api_key:     "${env:PI_API_KEY}"

# Multi-policy bridge handshake — see history_h6jtbq0w_20k.yaml for the
# contract. `bridge_policy_id` must match the registry entry on the
# bridge YAML.
bridge_admin_url: "http://moraband.stanford.edu:8765"
bridge_policy_id: "v7-nonhistory-real-center"

execute_chunk_size: 25
# No `prompt:` here — the runner injects card.prompt; see other YAMLs.

hz: 30
state_dim: 7
action_dim: 7
action_pos_slice: [0, 3]
action_yaw_index: 3

camera_map:
  forward:  "observation/rgb/image"
  downward: "observation/wrist_image/rgb/image"

# See sister `nonhistory_ccvhs1do_20k.yaml` for why these are required
# for the v7 gate-scenes finetunes.
image_size: 256
channel_order: "BGR"

gripper_overlay_paths:
  downward: configs/embodiments/assets/carl_wrist_overlay.png
server_frame: "mocap"

embodiment_path: configs/embodiments/carl_dual_mocap.yaml
traceability:
  variant: "pi07_nonhistory_real_center"
  wandb_run: "5b9p2kw1"
  step: 5000
  offline_mse: 2.3e-05
  checkpoint_uri: "gs://dronevla-raw-data/model_checkpoints/2026_may19/mar16_nonhistory_ft_dronevla_v7_gate_scenes_real_center_gpu_may19_140am/5b9p2kw1/5000/model_bfloat16/"
  processor_name: "dronevla_v7_gate_scenes"
  base_model: "gemma3_vla_with_states + NONHISTORY_LC"
  notes: "may19 GPU finetune on gate-scenes-real-center only. Episodes ~199 (301 frames each)."
