# Pi inference-client gateway — pi07 NONHISTORY mode
# (gemma3_vla_with_states + NONHISTORY_LC) finetuned from the 110k re-export
# of the 170k history-mode pretrain on dronevla v7 gate-scenes.

type: pi_gateway

gateway_url: "ws://moraband.stanford.edu:8766/v1/models/v7-nh-center"
api_key:     "${env:PI_API_KEY}"

execute_chunk_size: 25
prompt: "fly through the gate"

hz: 30
state_dim: 7
action_dim: 7
action_pos_slice: [0, 3]
action_yaw_index: 3

camera_map:
  forward:  "observation/rgb/image"
  downward: "observation/wrist_image/rgb/image"

# Match the training-data preprocess exactly:
#   - exporter.py resizes every render to 256² before PNG encode
#   - exporter.py flips RGB → BGR before save (configs/embodiments
#     /carl_dual_mocap.yaml::channel_order=BGR), so the on-disk PNGs hold
#     BGR bytes labeled "RGB" — the model was trained on those literal
#     pixels and expects the same channel order at inference.
# Without these two knobs the v7 finetune sees red/blue-swapped pixels
# at a different aspect ratio than at training time.
image_size: 256
channel_order: "BGR"

server_frame: "mocap"

traceability:
  variant: "pi07_nonhistory"
  wandb_run: "ccvhs1do"
  wandb_url: "https://pi.wandb.io/physical-intelligence/octoplus/runs/ccvhs1do"
  step: 20000
  offline_mse: 9.35e-06
  checkpoint_uri: "gs://dronevla-raw-data/model_checkpoints/2026_may17/mar16_nonhistory_ft_dronevla_v7_gate_scenes_may16_311am/ccvhs1do/20000/model_bfloat16/"
  processor_name: "dronevla_v7_gate_scenes"
  base_model: "gemma3_vla_with_states + NONHISTORY_LC"
  pretrain_source: "110k re-export of 170k history-mode pretrain"
  training_recipe: "deft_simba_v2_1; simulated_delay=10 train-time RTC; batch=256; peak_lr=3e-5 (5x decay); ~24 epochs / 214,775 steps"
  source_datasets:
    - "gate-scenes-all-no-3pov (300 ep / 79,625 steps)"
    - "gate-scenes-center-no-3pov (100 ep / 30,100 steps)"
    - "gate-scenes-real-center-no-3pov (200 ep / 55,525 steps)"
    - "gate-scenes-real-synth-no-3pov (200 ep / 49,525 steps)"
