# Pi inference-client gateway — pi07 NONHISTORY mode, "center only" finetune
# (g3jt73md / step 3000). may19 GPU finetune on the synthetic gate-scenes-center
# subset only.

type: pi_gateway

gateway_url: "ws://moraband.stanford.edu:8765/v1/models/v7-nonhistory-center"
api_key:     "${env:PI_API_KEY}"

# Multi-policy bridge handshake — see history_h6jtbq0w_20k.yaml for the
# contract. `bridge_policy_id` must match the registry entry on the
# bridge YAML.
bridge_admin_url: "http://moraband.stanford.edu:8765"
bridge_policy_id: "v7-nonhistory-center"

execute_chunk_size: 25
# No `prompt:` here — the runner injects card.prompt; see other YAMLs.

hz: 30
state_dim: 7
action_dim: 7
action_pos_slice: [0, 3]
action_yaw_index: 3

camera_map:
  forward:  "observation/rgb/image"
  downward: "observation/wrist_image/rgb/image"

# Match the training-data preprocess exactly. See
# `nonhistory_ccvhs1do_20k.yaml` for the rationale.
image_size: 256
channel_order: "BGR"

server_frame: "mocap"

traceability:
  variant: "pi07_nonhistory_center"
  wandb_run: "g3jt73md"
  step: 3000
  offline_mse: 2.4e-05
  checkpoint_uri: "gs://dronevla-raw-data/model_checkpoints/2026_may19/mar16_nonhistory_ft_dronevla_v7_gate_scenes_center_gpu_may19_140am/g3jt73md/3000/model_bfloat16/"
  processor_name: "dronevla_v7_gate_scenes"
  base_model: "gemma3_vla_with_states + NONHISTORY_LC"
  notes: "may19 GPU finetune on gate-scenes-center only (~99 episodes / 301 frames each)."
