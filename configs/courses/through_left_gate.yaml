# Example course: traverse the left gate, hovering past the table area.
# Waypoints are in MOCAP because that's how humans think about the scene
# (z-up, origin at the ArUco tag — see data/gate_scenes_export/README.md).
# The spline planner converts to NED via the scene's FrameGraph.
#
# Authoring workflow:
# 1. Edit waypoints/yaw_mode below.
# 2. Run `python -m falsify.cli.visualize_waypoints --course <this> --scene <scene>
#    --out runs/wpviz/...` and inspect the per-frame PLYs in MeshLab.
# 3. Once they look right, run `python -m falsify.cli.plan_trajectory --course <this>
#    --scene <scene> --out runs/courses/...` and feed the resulting NPZ into
#    `falsify.cli.export_training_data`.

name: through_left_gate
scene: configs/scenes/left_gate.yaml
frame: mocap
fps: 10
total_time_s: 8.0

# How waypoint yaws are resolved when not explicitly set:
#  - tangent: yaw follows the direction of motion (atan2 of position derivative)
#  - interp : linear interpolation between waypoints that DO specify yaw
#  - fixed  : all unspecified yaws = 0
yaw_mode: tangent

waypoints:
  - { name: start,     p: [-0.5,  0.70, 1.50], yaw: 0.0, t: 0.0 }
  - { name: pre_gate,  p: [ 0.30, 0.70, 1.50] }
  - { name: gate,      p: [ 0.86, 0.69, 1.50] }
  - { name: post_gate, p: [ 1.40, 0.70, 1.50] }
  - { name: goal,      p: [ 1.50, -0.30, 1.40], t: 8.0 }

velocity_constraints:
  max_speed_mps: 1.5    # (informational; spline planner ignores; MPC will honour)
  max_yaw_rate_rad_s: 1.0
